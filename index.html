<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro de caja</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0F2E22; font-family: system-ui, -apple-system, sans-serif; color: #F4EFE4; padding-bottom: 40px; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .num { font-family: 'SFMono-Regular', 'Courier New', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  header { padding: 28px 20px 20px; border-bottom: 3px double #C9A227; }
  header .eyebrow { color: #C9A227; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
  header h1 { font-size: 26px; font-weight: 400; margin-top: 4px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  select, input, button { font-family: inherit; font-size: 15px; }
  select:focus, input:focus { outline: 2px solid #C9A227; outline-offset: 1px; }
  .month-select { width: 100%; background: #153A2C; color: #F4EFE4; border: 1px solid #2A5A45; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .card { background: #153A2C; border-radius: 8px; padding: 14px; border: 1px solid #2A5A45; }
  .card .label { color: #9FBFA8; font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 19px; }
  .balance { border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .balance.pos { background: #1D4A38; border: 1px solid #2E6B4F; }
  .balance.neg { background: #4A2320; border: 1px solid #6B3A34; }
  .balance .value { font-size: 20px; font-weight: 600; }
  .panel { background: #153A2C; border-radius: 8px; padding: 14px 16px; border: 1px solid #2A5A45; margin-bottom: 12px; }
  .panel .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .panel .label { color: #9FBFA8; font-size: 12px; }
  .chips { display: flex; gap: 4px; }
  .chip { padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; border: 1px solid #2A5A45; background: transparent; color: #9FBFA8; }
  .chip.active { border-color: #C9A227; background: #C9A227; color: #0F2E22; font-weight: 700; }
  .amtline { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .amtline .big { font-size: 17px; }
  .amtline .small { color: #9FBFA8; font-size: 13px; }
  .bar { background: #0F2E22; border-radius: 4px; height: 8px; overflow: hidden; margin-bottom: 8px; }
  .bar-fill { height: 100%; }
  .status { font-size: 12px; }
  .status.ok { color: #7FB37A; }
  .status.bad { color: #C96A5A; }
  .goal-chips { display: flex; gap: 6px; margin-top: 4px; }
  .goal-chip { flex: 1; padding: 6px 0; font-size: 12px; border-radius: 5px; cursor: pointer; border: 1px solid #2A5A45; background: transparent; color: #9FBFA8; text-align: center; }
  .goal-chip.active { border-color: #C9A227; background: #C9A227; color: #0F2E22; font-weight: 700; }
  .form-panel { background: #F4EFE4; border-radius: 8px; padding: 16px; margin-bottom: 20px; color: #1C1C1C; }
  .form-panel h2 { font-size: 15px; font-weight: 400; margin-bottom: 12px; }
  .type-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .type-btn { flex: 1; padding: 9px 0; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid #C9C4B4; background: transparent; color: #4A4638; text-transform: capitalize; }
  .type-btn.active { border-color: #0F2E22; background: #0F2E22; color: #F4EFE4; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .form-panel input, .form-panel select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #C9C4B4; }
  .full { width: 100%; margin-bottom: 10px; }
  .err { color: #B33A3A; font-size: 13px; margin-bottom: 8px; }
  .add-btn { width: 100%; padding: 11px 0; border-radius: 6px; border: none; cursor: pointer; background: #C9A227; color: #0F2E22; font-size: 15px; font-weight: 700; }
  .section-title { color: #C9A227; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .empty { color: #9FBFA8; font-size: 14px; padding: 20px 0; text-align: center; }
  .list { border-top: 1px solid #2A5A45; }
  .mov { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid #2A5A45; }
  .mov .cat { font-size: 14px; }
  .mov .date { color: #7FA48A; font-size: 12px; margin-top: 2px; }
  .mov .right { display: flex; align-items: center; gap: 10px; }
  .mov .amt { font-size: 15px; font-weight: 600; }
  .mov .amt.in { color: #7FB37A; }
  .mov .amt.out { color: #C96A5A; }
  .mov button { background: none; border: none; cursor: pointer; color: #6B7A70; font-size: 16px; padding: 4px; }
  .footer-note { color: #5A6B60; font-size: 11px; text-align: center; margin: 24px 0 8px; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Libro de caja</div>
  <h1 class="serif">Ingresos y gastos</h1>
</header>
<div class="wrap">
  <select id="mesFiltro" class="month-select"></select>

  <div class="cards">
    <div class="card">
      <div class="label">↗ Ingresos</div>
      <div class="value num" id="totalIngresos">$0</div>
    </div>
    <div class="card">
      <div class="label">↘ Gastos</div>
      <div class="value num" id="totalGastos">$0</div>
    </div>
  </div>

  <div class="balance" id="balanceCard">
    <span>💰 Balance del mes</span>
    <span class="value num" id="balanceValue">$0</span>
  </div>

  <div class="panel">
    <div class="row">
      <span class="label">🎯 Meta de ahorro mensual</span>
      <div class="chips" id="pctChips"></div>
    </div>
    <div id="metaMensualBody"></div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="label" id="metaMesesLabel">🎯 Meta: fondo de emergencia</span>
    </div>
    <div class="amtline">
      <span class="big num" id="ahorradoTotal">$0</span>
      <span class="small num" id="metaFondoLabel"> / $0</span>
    </div>
    <div class="bar"><div class="bar-fill" id="metaFondoBar" style="background:#C9A227;width:0%"></div></div>
    <div class="goal-chips" id="mesesChips"></div>
  </div>

  <div class="form-panel">
    <h2 class="serif">Nuevo movimiento</h2>
    <div class="type-row" id="tipoRow">
      <button class="type-btn active" data-tipo="gasto">Gasto</button>
      <button class="type-btn" data-tipo="ingreso">Ingreso</button>
    </div>
    <div class="grid2">
      <input type="number" inputmode="decimal" id="montoInput" placeholder="Monto ($)">
      <input type="date" id="fechaInput">
    </div>
    <select id="categoriaInput" class="full"></select>
    <input type="text" id="notaInput" class="full" placeholder="Nota (opcional)">
    <div class="err" id="errMsg" style="display:none"></div>
    <button class="add-btn" id="addBtn">+ Agregar</button>
  </div>

  <div class="section-title" id="listTitle">Movimientos</div>
  <div id="listBody"></div>

  <p class="footer-note">Los datos se guardan solo en este dispositivo.</p>
</div>

<script>
const CATS_GASTO = ["Alquiler/Vivienda","Comida","Transporte","Servicios","Salud","Ocio","Deudas/Tarjetas","Otros"];
const CATS_INGRESO = ["Sueldo","Extra/Freelance","Venta","Otros"];
const STORAGE_KEY = "ahorro-data-v1";

const fmt = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const monthKey = d => d.slice(0,7);
const MESES_NOM = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const monthLabel = k => { const [y,m]=k.split("-"); return `${MESES_NOM[parseInt(m,10)-1]} ${y}`; };
const todayStr = () => new Date().toISOString().slice(0,10);

let state = { movimientos: [], metaMeses: 3, metaPct: 40 };
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch(e) {}

let tipo = "gasto";
let mesFiltro = monthKey(todayStr());

function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function buildMesesList() {
  const set = new Set(state.movimientos.map(m => monthKey(m.fecha)));
  set.add(mesFiltro);
  let y=2026, m=8; const fin={y:2027,m:3};
  while (y < fin.y || (y===fin.y && m<=fin.m)) { set.add(`${y}-${String(m).padStart(2,"0")}`); m++; if(m>12){m=1;y++;} }
  return Array.from(set).sort().reverse();
}

function categoriasParaTipo(t) { return t === "gasto" ? CATS_GASTO : CATS_INGRESO; }

function render() {
  // month select
  const sel = document.getElementById("mesFiltro");
  const meses = buildMesesList();
  sel.innerHTML = meses.map(k => `<option value="${k}" ${k===mesFiltro?"selected":""}>${monthLabel(k)}</option>`).join("");

  const delMes = state.movimientos.filter(m => monthKey(m.fecha) === mesFiltro);
  const totalIngresos = delMes.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+m.monto,0);
  const totalGastos = delMes.filter(m=>m.tipo==="gasto").reduce((a,m)=>a+m.monto,0);
  const balance = totalIngresos - totalGastos;

  document.getElementById("totalIngresos").textContent = fmt(totalIngresos);
  document.getElementById("totalGastos").textContent = fmt(totalGastos);
  document.getElementById("balanceValue").textContent = fmt(balance);
  const bc = document.getElementById("balanceCard");
  bc.className = "balance " + (balance>=0 ? "pos" : "neg");

  // meta mensual
  const pctChips = document.getElementById("pctChips");
  pctChips.innerHTML = [30,40,50].map(p => `<button class="chip ${state.metaPct===p?"active":""}" data-pct="${p}">${p}%</button>`).join("");
  const metaBody = document.getElementById("metaMensualBody");
  if (totalIngresos === 0) {
    metaBody.innerHTML = `<p style="color:#9FBFA8;font-size:13px">Cargá tu ingreso del mes para calcular la meta en $ y ver el seguimiento.</p>`;
  } else {
    const metaMonto = totalIngresos * (state.metaPct/100);
    const hoy = new Date();
    const esMesActual = mesFiltro === monthKey(todayStr());
    const diaDelMes = hoy.getDate();
    const diasEnMes = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0).getDate();
    const prop = esMesActual ? diaDelMes/diasEnMes : 1;
    const esperado = metaMonto * prop;
    const dif = balance - esperado;
    const ok = dif >= 0;
    const pctBar = Math.min(100, Math.max(0, (balance/metaMonto)*100));
    metaBody.innerHTML = `
      <div class="amtline"><span class="big num">${fmt(Math.max(balance,0))}</span><span class="small num"> meta: ${fmt(metaMonto)} (${state.metaPct}% de ${fmt(totalIngresos)})</span></div>
      <div class="bar"><div class="bar-fill" style="width:${pctBar}%;background:${ok?"#7FB37A":"#C96A5A"}"></div></div>
      ${esMesActual ? `<p class="status ${ok?"ok":"bad"}">${ok ? `Vas a tiempo según el día del mes (día ${diaDelMes}/${diasEnMes}).` : `Atrasado vs. lo esperado a esta altura del mes: faltan ${fmt(Math.abs(dif))}.`}</p>` : ""}
    `;
  }

  // fondo emergencia
  const gastosPorMes = {};
  state.movimientos.filter(m=>m.tipo==="gasto").forEach(m => { const k=monthKey(m.fecha); gastosPorMes[k]=(gastosPorMes[k]||0)+m.monto; });
  const vals = Object.values(gastosPorMes);
  const gastoPromedio = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : totalGastos;
  const metaFondo = gastoPromedio * state.metaMeses;
  const ahorradoTotal = state.movimientos.reduce((a,m)=>a+(m.tipo==="ingreso"?m.monto:-m.monto),0);
  const progreso = metaFondo>0 ? Math.min(100,Math.max(0,(ahorradoTotal/metaFondo)*100)) : 0;

  document.getElementById("metaMesesLabel").textContent = `🎯 Meta: fondo de emergencia (${state.metaMeses} ${state.metaMeses===1?"mes":"meses"} de gastos)`;
  document.getElementById("ahorradoTotal").textContent = fmt(Math.max(ahorradoTotal,0));
  document.getElementById("metaFondoLabel").textContent = " / " + fmt(metaFondo);
  document.getElementById("metaFondoBar").style.width = progreso + "%";
  document.getElementById("mesesChips").innerHTML = [3,6,12].map(mm => `<button class="goal-chip ${state.metaMeses===mm?"active":""}" data-meses="${mm}">${mm} meses</button>`).join("");

  // form
  document.querySelectorAll(".type-btn").forEach(b => b.classList.toggle("active", b.dataset.tipo === tipo));
  const catSel = document.getElementById("categoriaInput");
  const cats = categoriasParaTipo(tipo);
  catSel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join("");

  // list
  document.getElementById("listTitle").textContent = "Movimientos — " + monthLabel(mesFiltro);
  const ordenado = [...delMes].sort((a,b) => a.fecha < b.fecha ? 1 : -1);
  const listBody = document.getElementById("listBody");
  if (ordenado.length === 0) {
    listBody.innerHTML = `<p class="empty">Todavía no cargaste movimientos este mes.</p>`;
  } else {
    listBody.innerHTML = `<div class="list">` + ordenado.map(m => `
      <div class="mov">
        <div>
          <div class="cat">${m.categoria}${m.nota ? " · " + m.nota : ""}</div>
          <div class="date num">${m.fecha}</div>
        </div>
        <div class="right">
          <span class="amt num ${m.tipo==="ingreso"?"in":"out"}">${m.tipo==="ingreso"?"+":"−"}${fmt(m.monto)}</span>
          <button data-del="${m.id}">🗑</button>
        </div>
      </div>
    `).join("") + `</div>`;
  }

  attachDynamicHandlers();
}

function attachDynamicHandlers() {
  document.getElementById("mesFiltro").onchange = e => { mesFiltro = e.target.value; render(); };
  document.querySelectorAll(".type-btn").forEach(b => b.onclick = () => { tipo = b.dataset.tipo; render(); });
  document.querySelectorAll("[data-pct]").forEach(b => b.onclick = () => { state.metaPct = parseInt(b.dataset.pct,10); persist(); render(); });
  document.querySelectorAll("[data-meses]").forEach(b => b.onclick = () => { state.metaMeses = parseInt(b.dataset.meses,10); persist(); render(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    state.movimientos = state.movimientos.filter(m => m.id !== b.dataset.del);
    persist(); render();
  });
}

document.getElementById("fechaInput").value = todayStr();

document.getElementById("addBtn").onclick = () => {
  const montoInput = document.getElementById("montoInput");
  const val = parseFloat(montoInput.value);
  const errMsg = document.getElementById("errMsg");
  if (!val || val <= 0) {
    errMsg.textContent = "Ingresá un monto válido.";
    errMsg.style.display = "block";
    return;
  }
  errMsg.style.display = "none";
  const nuevo = {
    id: Date.now().toString(36),
    tipo,
    monto: val,
    categoria: document.getElementById("categoriaInput").value,
    fecha: document.getElementById("fechaInput").value || todayStr(),
    nota: document.getElementById("notaInput").value.trim(),
  };
  state.movimientos.unshift(nuevo);
  persist();
  montoInput.value = "";
  document.getElementById("notaInput").value = "";
  render();
};

render();
</script>
</body>
</html>
